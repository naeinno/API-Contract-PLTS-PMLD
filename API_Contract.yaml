openapi: 3.0.3
info:
  title: Sistem Monitoring PLTS - API Contract
  description: >
    Dokumentasi API Contract untuk sistem monitoring PLTS (MVP).
    MVP ini tidak mencakup autentikasi user (login/session) pada Web Dashboard;
    keamanan hanya diterapkan pada jalur machine-to-machine (ingest sensor,
    webhook Telegram, dan komunikasi internal backend-bot).
  version: 1.2.0
servers:
  - url: http://localhost:3000/api/v1
    description: Development Server (Local)
  - url: https://api.plts-monitoring.com/api/v1
    description: Production Server

tags:
  - name: Telemetry
    description: Ingestion Raw Data 9 Metrik Sensor dari ESP8266, serta query data realtime & history untuk Web Dashboard
  - name: Alerting & Thresholds
    description: Manajemen Tresholds Safe Limit Sensor & Log Peringatan
  - name: Telegram Bot
    description: Integrasi Webhook Notifikasi Automatic Alert & Command Bot
  - name: System
    description: Health-check kondisi sistem/device

paths:
  # ============================================================
  # TELEMETRY (INGEST + QUERY)
  # ============================================================
  /telemetry/ingest:
    post:
      tags: [Telemetry]
      summary: Pengiriman Data Telemetri ESP8266
      description: Menerima 9 metrik raw data dari sensor PLTS dengan validasi `X-Device-API-Key`.
      operationId: ingestTelemetry
      security:
        - DeviceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Data Telemetri Berhasil Disimpan
          content:
            application/json:
              example:
                status: success
                message: Telemetry data successfully recorded.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /telemetry/latest:
    get:
      tags: [Telemetry]
      summary: Fetch Data Realtime
      description: Mengambil 9 metrik sensor terkini untuk ditampilkan pada Web Dashboard.
      operationId: getLatestTelemetry
      responses:
        '200':
          description: Data Realtime Berhasil Diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeResponse'

  /telemetry/history:
    get:
      tags: [Telemetry]
      summary: Fetch Riwayat Data (Grafik Tren)
      description: >
        Mengambil data historis (voltage, current, power)
        untuk membuat grafik tren panel/beban/baterai.
      operationId: getTelemetryHistory
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Batas awal rentang waktu. Default 24 jam sebelum `to`.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Batas akhir rentang waktu. Default sekarang.
        - name: interval
          in: query
          schema:
            type: string
            enum: [raw, 5m, 10m, 1h, 1d]
            default: 10m
          description: Interval agregasi rata-rata, agar rentang panjang tidak mengirim ribuan titik mentah.
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
          description: Batas maksimum jumlah titik data yang dikembalikan.
      responses:
        '200':
          description: Riwayat Data Berhasil Diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  # ============================================================
  # ALERTING & THRESHOLDS
  # ============================================================
  /alerts/config:
    get:
      tags: [Alerting & Thresholds]
      summary: Get Setting Ambang Batas Alert
      description: Melihat batas aman (warning & critical) parameter PLTS saat ini.
      responses:
        '200':
          description: Data Threshold Berhasil Diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdsResponse'
    put:
      tags: [Alerting & Thresholds]
      summary: Update Ambang Batas Alert
      description: >
        Mengubah batas peringatan agar server tahu kapan harus memicu notifikasi ke Telegram.
        Body bersifat partial update - kirim hanya field yang ingin diubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdsConfig'
      responses:
        '200':
          description: Threshold Peringatan Berhasil Diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /alerts/log:
    get:
      tags: [Alerting & Thresholds]
      summary: Riwayat Alert yang Pernah Dikirim
      description: Log historis notifikasi (warning/critical) untuk ditampilkan di Web Dashboard.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: level
          in: query
          schema: { type: string, enum: [warning, critical] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Log Alert Berhasil Diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsLogResponse'

  # ============================================================
  # SYSTEM
  # ============================================================
  /system/status:
    get:
      tags: [System]
      summary: Health-check Sistem & Device
      description: Status koneksi device ESP8266 (online/last-seen). Dipakai bot untuk command `/status` dan indikator koneksi di dashboard.
      responses:
        '200':
          description: Status Sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

  # ============================================================
  # TELEGRAM BOT
  # ============================================================
  /telegram/webhook:
    post:
      tags: [Telegram Bot]
      summary: Webhook Listener Telegram Bot (Inbound)
      description: >
        Menerima command dari Teknisi via Telegram: `/start` (pesan sambutan),
        `/status` (kueri kondisi terkini via `GET /telemetry/latest`), dan `/help` (daftar command).
        **Wajib** divalidasi lewat header `X-Telegram-Bot-Api-Secret-Token`
        (fitur bawaan Telegram Bot API saat `setWebhook`) agar endpoint ini
        tidak bisa dipanggil/dipalsukan oleh pihak luar.
      operationId: handleTelegramWebhook
      security:
        - TelegramSecretToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUpdate'
      responses:
        '200':
          description: Respons Webhook Berhasil
          content:
            application/json:
              example:
                status: success
                message: Command handled successfully.
        '401':
          description: Secret token tidak cocok - request ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /internal/alerts/dispatch:
    post:
      tags: [Telegram Bot]
      summary: "[Internal] Push Alert ke Bot Service (Outbound)"
      description: >
        **Bukan API publik.** Dipanggil oleh proses evaluasi ambang batas segera setelah
        `POST /telemetry/ingest` menemukan parameter di luar batas normal, sehingga notifikasi
        langsung terkirim ke Telegram tanpa menunggu perintah dari pengguna.
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
      responses:
        '202':
          description: Diterima dan akan diteruskan sebagai pesan Telegram (fire-and-forget)
        '401':
          $ref: '#/components/responses/401Unauthorized'

components:
  securitySchemes:
    DeviceKeyAuth:
      type: apiKey
      in: header
      name: X-Device-API-Key
      description: Dipakai ESP8266 saat mengirim data telemetri.
    ServiceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Dipakai server-to-server oleh proses backend saat memanggil Bot Service.
    TelegramSecretToken:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Secret yang didaftarkan saat `setWebhook` ke Telegram, untuk memastikan request memang berasal dari Telegram.

  schemas:
    # ---------- Generic ----------
    ApiError:
      type: object
      properties:
        status:
          type: string
          enum: [fail]
        message:
          type: string

    # ---------- Telemetry ----------
    ElectricalReading:
      type: object
      required: [voltage, current, power]
      properties:
        voltage: { type: number, format: float, description: Volt (V), example: 13.65 }
        current: { type: number, format: float, description: "mA. Boleh negatif khusus baterai (discharge).", example: 1021.90 }
        power: { type: number, format: float, description: "mW. Boleh negatif khusus baterai (discharge).", example: 13854 }

    TelemetryMetrics:
      type: object
      required: [panel, beban, baterai]
      properties:
        panel: { $ref: '#/components/schemas/ElectricalReading' }
        beban: { $ref: '#/components/schemas/ElectricalReading' }
        baterai: { $ref: '#/components/schemas/ElectricalReading' }
      example:
        panel: { voltage: 13.65, current: 1021.90, power: 13854 }
        beban: { voltage: 5.11, current: 292.30, power: 1488 }
        baterai: { voltage: 13.44, current: -840, power: 11306 }

    IngestRequest:
      type: object
      required: [device_id, timestamp, metrics]
      properties:
        device_id: { type: string, example: ESP8266_PLTS_01 }
        timestamp: { type: string, format: date-time, example: "2025-06-22T13:46:00Z" }
        metrics: { $ref: '#/components/schemas/TelemetryMetrics' }
      example:
        device_id: ESP8266_PLTS_01
        timestamp: "2025-06-22T13:46:00Z"
        metrics:
          panel: { voltage: 13.65, current: 1021.90, power: 13854 }
          beban: { voltage: 5.11, current: 292.30, power: 1488 }
          baterai: { voltage: 13.44, current: -840, power: 11306 }

    RealtimeResponse:
      type: object
      properties:
        status: { type: string, enum: [success] }
        data:
          type: object
          properties:
            panel: { $ref: '#/components/schemas/ElectricalReading' }
            beban: { $ref: '#/components/schemas/ElectricalReading' }
            baterai: { $ref: '#/components/schemas/ElectricalReading' }
            system_status:
              type: string
              enum: [normal, warning, critical]
              description: Hasil evaluasi terhadap ambang batas di `/alerts/config`.
            last_updated: { type: string, format: date-time }
      example:
        status: success
        data:
          panel: { voltage: 13.65, current: 1021.90, power: 13854 }
          beban: { voltage: 5.11, current: 292.30, power: 1488 }
          baterai: { voltage: 13.44, current: -840, power: 11306 }
          system_status: normal
          last_updated: "2025-06-22T13:46:00Z"

    HistoryPoint:
      type: object
      required: [timestamp, panel, beban, baterai]
      properties:
        timestamp: { type: string, format: date-time }
        panel: { $ref: '#/components/schemas/ElectricalReading' }
        beban: { $ref: '#/components/schemas/ElectricalReading' }
        baterai: { $ref: '#/components/schemas/ElectricalReading' }
      example:
        timestamp: "2025-06-22T13:40:00Z"
        panel: { voltage: 13.60, current: 950.00, power: 12920 }
        beban: { voltage: 5.02, current: 290.00, power: 1456 }
        baterai: { voltage: 13.40, current: -700, power: 9380 }

    HistoryResponse:
      type: object
      properties:
        status: { type: string, enum: [success] }
        data:
          type: object
          properties:
            interval: { type: string, example: 10m }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            points:
              type: array
              items: { $ref: '#/components/schemas/HistoryPoint' }
      example:
        status: success
        data:
          interval: 10m
          from: "2025-06-21T13:40:00Z"
          to: "2025-06-22T13:40:00Z"
          points:
            - timestamp: "2025-06-22T13:30:00Z"
              panel: { voltage: 13.60, current: 950.00, power: 12920 }
              beban: { voltage: 5.02, current: 290.00, power: 1456 }
              baterai: { voltage: 13.40, current: -700, power: 9380 }
            - timestamp: "2025-06-22T13:40:00Z"
              panel: { voltage: 13.65, current: 1021.90, power: 13854 }
              beban: { voltage: 5.11, current: 292.30, power: 1488 }
              baterai: { voltage: 13.44, current: -840, power: 11306 }

    # ---------- Thresholds & Alerts ----------
    ThresholdLevel:
      type: object
      description: Dua tingkat ambang batas - warning (peringatan dini, indikator visual saja) dan critical (darurat, memicu push alert ke Telegram).
      properties:
        warning: { type: number }
        critical: { type: number }

    ThresholdsConfig:
      type: object
      description: >
        Sesuai scope MVP: ambang batas hanya diterapkan pada baterai (pemicu push alert
        saat baterai di bawah batas aman). Nilai default dihitung dari spesifikasi VRLA 12V 12Ah
        (sesuai desain sistem pada jurnal acuan).
      properties:
        baterai:
          type: object
          properties:
            voltage_low:
              allOf: [{ $ref: '#/components/schemas/ThresholdLevel' }]
              description: Satuan Volt (V).
            discharge_current:
              allOf: [{ $ref: '#/components/schemas/ThresholdLevel' }]
              description: Satuan mA. Nilai negatif (arah keluar dari baterai).
      example:
        baterai:
          voltage_low: { warning: 12.0, critical: 11.5 }
          discharge_current: { warning: -1500, critical: -3000 }

    ThresholdsResponse:
      type: object
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/ThresholdsConfig' }

    Alert:
      type: object
      properties:
        id: { type: string, example: alrt_0001 }
        timestamp: { type: string, format: date-time }
        level: { type: string, enum: [warning, critical] }
        metric: { type: string, example: baterai.voltage }
        value: { type: number }
        threshold: { type: number }
        message: { type: string, example: Tegangan baterai di bawah ambang aman }
        delivered_to_telegram: { type: boolean }

    AlertsLogResponse:
      type: object
      properties:
        status: { type: string, enum: [success] }
        data:
          type: object
          properties:
            alerts:
              type: array
              items: { $ref: '#/components/schemas/Alert' }

    # ---------- System ----------
    SystemStatus:
      type: object
      properties:
        device_online: { type: boolean }
        ingest_last_seen: { type: string, format: date-time }
        api_version: { type: string, example: "1.2.0" }

    SystemStatusResponse:
      type: object
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/SystemStatus' }

    # ---------- Telegram ----------
    TelegramUpdate:
      type: object
      description: >
        Bentuk minimal dari Telegram Bot API Update object. `message.text` berisi salah satu
        command yang didukung MVP: `/start`, `/status`, atau `/help`.
      properties:
        update_id: { type: integer }
        message:
          type: object
          properties:
            message_id: { type: integer }
            text:
              type: string
              example: "/status"
              description: "Command yang didukung MVP: /start, /status, /help. Command lain diabaikan/direspons default."
            chat:
              type: object
              properties:
                id: { type: integer, example: 123456789 }

  responses:
    400BadRequest:
      description: Payload request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: fail
            message: Format data yang dikirim tidak sesuai spesifikasi.
    401Unauthorized:
      description: API Key / Secret Token tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: fail
            message: Akses ditolak. Kredensial tidak valid.
